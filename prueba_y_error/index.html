<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <title>Sistema Solar VR</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>


    <!-- PANTALLA DE CARGA -->
    <div id="pantalla-carga">
      <div class="contenedor-carga">
        <h2 id="texto-loading">CARGANDO SISTEMA SOLAR</h2>
        <div class="barra-base">
          <div id="barra-progreso"></div>
        </div>
        <p id="porcentaje">0%</p>
      </div>
    </div>

    <!-- ESCENA 3D / VR -->
    <a-scene webxr="optionalFeatures: hit-test;">

      <!-- RECURSOS -->
      <a-assets>
        <img id="tex-marte" src="marte.jpg">
        <img id="tex-mercurio" src="mercurio.jpg">
        <img id="tex-venus" src="venus.jpg">
        <img id="tex-jupiter" src="jupiter.jpg">
        <img id="tex-saturno" src="saturno.jpg">
        <img id="tex-urano" src="urano.jpg">
        <img id="tex-neptuno" src="neptuno.jpg">
        <img id="tex-anillo de saturno" src="anillo-saturno.jpg">
        <img id="tex-sol" src="sol.jpg">
        <img id="tex-tierra" src="tierra.jpg">
        <audio id="snd-correcto" src="sonidos/correcto.mp3" preload="auto"></audio>
        <audio id="snd-incorrecto" src="sonidos/incorrecto.mp3" preload="auto"></audio>
      </a-assets>

      <!-- ILUMINACIÓN -->
      <a-light type="ambient" color="#ffffff" intensity="0.8"></a-light>
      <a-light type="point" position="-20 1.6 0" intensity="3" color="#ffaa44"></a-light>

      <!-- FONDO GALÁCTICO -->
      <a-sky color="#020208"></a-sky>

      <!-- CAMPO DE ESTRELLAS -->
      <a-entity id="estrellas">
        <a-sphere position="10 15 -20" radius="0.05" color="#ffffff" material="shader: flat"></a-sphere>
        <a-sphere position="-15 20 -10" radius="0.08" color="#aaccff" material="shader: flat"></a-sphere>
        <a-sphere position="5 -10 -15" radius="0.06" color="#ffffff" material="shader: flat"></a-sphere>
        <a-sphere position="-20 -5 15" radius="0.07" color="#ffddaa" material="shader: flat"></a-sphere>
        <a-sphere position="18 8 12" radius="0.05" color="#ffffff" material="shader: flat"></a-sphere>
        <a-sphere position="-8 25 5" radius="0.06" color="#ffffff" material="shader: flat"></a-sphere>
        <a-sphere position="0 12 -25" radius="0.09" color="#66ccff" material="shader: flat"></a-sphere>
      </a-entity>

      <!-- CÁMARA DEL JUGADOR (Alejada más atrás en Z = 4.0 por defecto para evitar colisiones) -->
      <a-entity id="jugador" position="-9 1.6 4.0">
        <a-camera id="camara">
          
          <!-- CURSOR DE CARGA CON MIRADA FIJA (FUSE) -->
          <a-entity 
            id="cursor-wrapper"
            position="0 0 -1"
            geometry="primitive: ring; radiusInner: 0.015; radiusOuter: 0.025"
            material="color: #00ffcc; shader: flat; opacity: 0.8; transparent: true"
            cursor="fuse: true; fuseTimeout: 2500"
            raycaster="objects: .interactivo"
            animation__fusing="property: scale; startEvents: fusing; easing: linear; dur: 2500; from: 1 1 1; to: 0.1 0.1 0.1"
            animation__mouseleave="property: scale; startEvents: mouseleave; easing: easeOutQuad; dur: 200; to: 1 1 1"
            animation__click="property: scale; startEvents: click; easing: easeOutQuad; dur: 150; to: 1 1 1">
            <a-circle radius="0.005" color="#ffffff" material="shader: flat"></a-circle>
          </a-entity>

          <!-- PUNTUAJE HUD EN CÁMARA -->
          <a-text id="texto-puntaje" value="PUNTOS: 0" position="-1.2 0.8 -1.2" color="#00ffcc" scale="0.4 0.4 0.4"></a-text>
        </a-camera>
      </a-entity>

      <!-- PANEL DE PREGUNTAS E INFORMACIÓN (Más grande y posicionado a Z = 2.0) -->
      <a-plane 
        id="panel-info" 
        position="-9 2.1 2.0"
        rotation="0 0 0" 
        scale="0.001 0.001 0.001" 
        width="1.8" 
        height="1.2" 
        color="#101428" 
        material="shader: flat; opacity: 0.95; transparent: true" 
        visible="false"
        animation__scale_in="property: scale; from: 0.001 0.001 0.001; to: 1.4 1.4 1.4; dur: 400; easing: easeOutBack; startEvents: mostrar-panel"
        animation__fade_in="property: material.opacity; from: 0; to: 0.95; dur: 300; easing: linear; startEvents: mostrar-panel"
        animation__scale_out="property: scale; from: 1.4 1.4 1.4; to: 0.001 0.001 0.001; dur: 300; easing: easeInBack; startEvents: ocultar-panel"
        animation__fade_out="property: material.opacity; from: 0.95; to: 0; dur: 250; easing: linear; startEvents: ocultar-panel">

        <!-- TEXTO PRINCIPAL DEL PANEL -->
        <a-text id="texto-panel" value="" color="#ffffff" align="center" width="1.6" position="0 0.28 0.02"></a-text>

        <!-- BOTÓN CONTINUAR -->
        <a-plane id="btn-continuar" class="interactivo" position="0 -0.38 0.02" width="0.85" height="0.22" color="#2980b9" material="shader: flat" visible="false">
          <a-text value="CONTINUAR" color="#ffffff" align="center" width="1.3" position="0 0 0.01"></a-text>
        </a-plane>

        <!-- BOTÓN A -->
        <a-plane id="btn-a" class="interactivo" position="-0.45 -0.28 0.02" width="0.75" height="0.22" color="#c0392b" material="shader: flat" visible="false">
          <a-text id="txt-a" value="A" color="#ffffff" align="center" width="1.2" position="0 0 0.01"></a-text>
        </a-plane>

        <!-- BOTÓN B -->
        <a-plane id="btn-b" class="interactivo" position="0.45 -0.28 0.02" width="0.75" height="0.22" color="#27ae60" material="shader: flat" visible="false">
          <a-text id="txt-b" value="B" color="#ffffff" align="center" width="1.2" position="0 0 0.01"></a-text>
        </a-plane>
      </a-plane>

      <!-- 0. EL SOL -->
      <a-sphere id="sol" radius="4.0" src="#tex-sol" position="-20 1.6 0" material="shader: flat; emissive: #ff4400" animation="property: rotation; to: 0 360 0; loop: true; dur: 40000; easing: linear">
        <a-text value="SOL" position="0 4.5 0" align="center" color="#ffcc00" scale="2 2 2"></a-text>
      </a-sphere>

      <!-- 1. MERCURIO -->
      <a-entity id="nodo-mercurio" position="-9 1.6 0">
        <a-sphere id="mercurio" class="interactivo" radius="0.55" src="#tex-mercurio" material="roughness: 0.9" animation="property: rotation; to: 0 360 0; loop: true; dur: 12000; easing: linear"></a-sphere>
        <a-text value="MERCURIO" position="0 0.9 0" align="center" color="white" scale="0.8 0.8 0.8"></a-text>
      </a-entity>

      <!-- 2. VENUS -->
      <a-entity id="nodo-venus" position="-6 1.6 0">
        <a-sphere id="venus" class="interactivo" radius="0.8" src="#tex-venus" material="roughness: 0.5" animation="property: rotation; to: 0 360 0; loop: true; dur: 16000; easing: linear"></a-sphere>
        <a-text value="VENUS" position="0 1.2 0" align="center" color="white" scale="0.9 0.9 0.9"></a-text>
      </a-entity>

      <!-- 3. TIERRA -->
      <a-entity id="nodo-tierra" position="-3 1.6 0">
        <a-sphere id="tierra" class="interactivo" radius="0.85" src="#tex-tierra" material="roughness: 0.6" animation="property: rotation; to: 0 360 0; loop: true; dur: 20000; easing: linear"></a-sphere>
        <a-text value="TIERRA" position="0 1.3 0" align="center" color="white" scale="0.9 0.9 0.9"></a-text>
      </a-entity>

      <!-- 4. MARTE -->
      <a-entity id="nodo-marte" position="0 1.6 0">
        <a-sphere id="marte" class="interactivo" radius="0.7" src="#tex-marte" material="roughness: 0.8" animation="property: rotation; to: 0 360 0; loop: true; dur: 22000; easing: linear"></a-sphere>
        <a-text value="MARTE" position="0 1.1 0" align="center" color="white" scale="0.9 0.9 0.9"></a-text>
      </a-entity>

      <!-- 5. JÚPITER (Posición X: 4, Y: 1.6, Z: 0) -->
      <a-entity id="nodo-jupiter" position="4 1.6 0">
        <a-sphere id="jupiter" class="interactivo" radius="1.8" src="#tex-jupiter" material="roughness: 0.7" animation="property: rotation; to: 0 360 0; loop: true; dur: 25000; easing: linear"></a-sphere>
        <a-text value="JUPITER" position="0 2.5 0" align="center" color="white" scale="1.4 1.4 1.4"></a-text>
      </a-entity>

      <!-- 6. SATURNO -->
      <a-entity id="nodo-saturno" position="8 1.6 0">
        <a-sphere id="saturno" class="interactivo" radius="1.4" src="#tex-saturno" material="roughness: 0.6" animation="property: rotation; to: 0 360 0; loop: true; dur: 28000; easing: linear"></a-sphere>
        <a-ring radius-inner="1.7" radius-outer="2.6" src="#tex-anillo de saturno" rotation="75 20 0" material="side: double; opacity: 0.8"></a-ring>
        <a-text value="SATURNO" position="0 2.2 0" align="center" color="white" scale="1.2 1.2 1.2"></a-text>
      </a-entity>

      <!-- 7. URANO -->
      <a-entity id="nodo-urano" position="12 1.6 0">
        <a-sphere id="urano" class="interactivo" radius="1.1" src="#tex-urano" material="roughness: 0.4" animation="property: rotation; to: 0 360 0; loop: true; dur: 32000; easing: linear"></a-sphere>
        <a-text value="URANO" position="0 1.6 0" align="center" color="white" scale="1 1 1"></a-text>
      </a-entity>

      <!-- 8. NEPTUNO -->
      <a-entity id="nodo-neptuno" position="16 1.6 0">
        <a-sphere id="neptuno" class="interactivo" radius="1.0" src="#tex-neptuno" material="roughness: 0.4" animation="property: rotation; to: 0 360 0; loop: true; dur: 35000; easing: linear"></a-sphere>
        <a-text value="NEPTUNO" position="0 1.5 0" align="center" color="white" scale="1 1 1"></a-text>
      </a-entity>

    </a-scene>

    <script src="main.js"></script>
  </body>
</html>
